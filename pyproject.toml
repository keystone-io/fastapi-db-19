[project]
name = "fastapi-db-19"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "himzei", email = "himzei@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "psycopg>=3.3.9",
    "psycopg-binary>=3.3.9",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
